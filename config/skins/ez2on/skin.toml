# EZ2CV — skins/ez2on/skin.toml  (LAYER 1: skin definition)
# =============================================================================
# Everything here is a property of the SKIN, not of the resolution.
# Resolution-dependent pixel geometry lives in profiles/<res>/<keymode>.toml.
# Adding a new key mode = add a row to [lane_colors] + a template folder.
# =============================================================================

[skin]
name                 = "ez2on"
reference_resolution = [1920, 1080]   # resolution the template PNGs were cut at.
                                      # If a profile's resolution differs, the
                                      # resolver rescales templates by
                                      # scale = profile_w / reference_w.

# --- lane color pattern per key mode -----------------------------------------
# Length MUST equal the profile's key_count. The resolver validates this.
[lane_colors]
"4k" = ["white", "cyan", "cyan", "white"]
"5k" = ["white", "cyan", "white", "cyan", "white"]
"6k" = ["white", "cyan", "white", "white", "cyan", "white"]
"8k" = ["white", "cyan", "white", "cyan", "cyan", "white", "cyan", "white"]

# --- templates, grouped by note color ----------------------------------------
# Filenames only. The resolver builds the full path as:
#   skins/<skin>/<key_mode>/<filename>
# so each key mode has its own template folder (note width differs per mode).
[templates.white]
note   = "note_white.png"
lnhead = "note_white_lnhead.png"
lntail = "note_white_lntail.png"

[templates.cyan]
note   = "note_cyan.png"
lnhead = "note_cyan_lnhead.png"
lntail = "note_cyan_lntail.png"

# --- Stage 1 detection channel per color -------------------------------------
# Which channel best separates a note of this color from the (black) lane bg.
# Verified on 1920x1080 speed-8.0 video:
#   white note ~218 in gray;  cyan note ~166 in gray BUT ~231 in max(B,G).
#   Using max_bg for cyan nearly equalizes both colors -> single Stage 1 gate.
# Valid values: gray | max_bg | max_gr | blue | green | red
[detection.channel]
white = "gray"
cyan  = "max_bg"

# --- thresholds (skin-dependent: note brightness/contrast varies by skin) -----
[thresholds]
matching          = 0.85   # Stage 2 min template-match score (TM_CCOEFF_NORMED).
                           # VERIFIED: white ~0.97, cyan ~0.92 on this skin.
stage1_brightness = 60.0   # Stage 1 gate: a row's MEAN value (0-255) on its
                           # detection channel must exceed this to be "lit".
                           # Recall-priority / loose by design (bg is ~0,
                           # note rows are ~166-230, so 60 is safely loose).

# Optional per-color overrides. Resolver falls back to the values above.
# [thresholds.matching_by_color]
# cyan = 0.80
# [thresholds.stage1_by_color]
# cyan = 50.0

# --- POW LED beat indicator: detection METHOD (skin-dependent) ----------------
# The ROI *coordinates* are pixel geometry -> they live in the profile.
[beat_indicator]
channel          = "green"
diff_threshold   = 2.0

# --- measure line detection --------------------------------------------------
# Measure lines span the full playfield width; detected by row-mean brightness.
# Layer 3 stacks the per-lane Stage 1 projections and keeps a row only if it is
# (1) lit in (almost) every lane, (2) within a mid-grey brightness window, and
# (3) thin (a chord of notes is ~22px thick).
#
# The "lit" test runs on the 2-row sliding ENERGY SUM of each lane's projection,
# not the raw row mean. A 1px line scrolling ~33px/frame straddles two pixel rows
# and splits its energy so neither row clears a single-row gate — that flicker
# was dropping whole measures (see measureline_detection_findings). Summing
# adjacent rows recovers the line's full energy regardless of straddle phase.
# Validated on 4 songs (incl. long-note-heavy Dream Walker): 94-96% recall, FP~0.
#
#   lit_energy_threshold : a lane's 2-row energy sum must exceed this to be "lit"
#   min_brightness       : single-row band-mean lower bound (rejects near-background)
#   max_brightness       : reject note-bright bands (~218 on this skin)
#   max_thickness        : reject thick bands (a chord; the judgment bar; glow) —
#                          this is what still rejects long-note bodies
#   lane_slack           : allow this many lanes to miss the coincidence (occlusion)
[measure_line]
# Calibrated on the 4-song validation set (see measureline_detection_findings):
# a thin full-width line's single-row band mean is ~p10=116..p50=127 when it lands
# cleanly on one row, but dips to ~55-90 in sub-pixel-split frames. The energy sum
# threshold (~single-row line brightness) catches those; the single-row floor only
# rejects pure background. Note bodies (~218) rejected by max_brightness, long-note
# bodies by max_thickness.
lit_energy_threshold = 50.0
min_brightness       = 40.0
max_brightness       = 180.0
max_thickness        = 8
lane_slack           = 1
